# Fixed project name, so the containers and the database volume keep their names whatever the folder is called.
name: quizmoo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quizmoo
      POSTGRES_PASSWORD: quizmoo
      POSTGRES_DB: quizmoo
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full app on http://localhost:3000 (or http://<laptop-ip>:3000 on the venue LAN).
  # SESSION_SECRET and APP_ORIGIN come from .env next to this file.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quizmoo:quizmoo@db:5432/quizmoo
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      RESULTS_RETENTION_DAYS: ${RESULTS_RETENTION_DAYS:-90}
      MAX_GAMES_PER_HOST: ${MAX_GAMES_PER_HOST:-200}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  dbdata:
